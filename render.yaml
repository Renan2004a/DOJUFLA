services:
  - type: web
    name: dojufla
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT --timeout 180
    healthCheckPath: /healthz
    envVars:
      - key: DOJUFLA_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_LLM
        value: groq
      - key: SUPERADMIN_USER
        value: admin
      - key: SUPERADMIN_PASSWORD
        sync: false
